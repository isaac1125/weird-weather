<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7eb8d4" />
    <meta
      name="description"
      content="Weird Weather — 為台灣日夜溫差設計的穿搭天氣建議"
    />
    <title>Weird Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sky__glow sky__glow--a"></div>
      <div class="sky__glow sky__glow--b"></div>
      <div class="sky__haze"></div>
    </div>

    <div id="app" class="app">
      <header class="topbar">
        <p class="brand">Weird Weather</p>
        <button
          type="button"
          class="location"
          id="location-btn"
          aria-haspopup="dialog"
          aria-controls="place-sheet"
          aria-expanded="false"
        >
          <span class="location__pin" id="location-pin" aria-hidden="true"></span>
          <span id="place-name">選擇地區…</span>
          <span class="location__chevron" aria-hidden="true">▾</span>
        </button>
        <p class="status-chip" id="data-status">讀取天氣</p>
      </header>

      <main class="main">
        <section class="hero-metrics" aria-label="目前天氣與空氣品質">
          <div class="metric metric--temp">
            <p class="metric__label">現在天氣</p>
            <p class="metric__value">
              <span id="current-temp">--</span><span class="unit">°</span>
            </p>
            <p class="metric__sub">
              體感 <span id="feels-like">--</span>°
            </p>
          </div>
          <div class="metric metric--aqi">
            <p class="metric__label">空氣品質</p>
            <p class="metric__value metric__value--sm">
              <span id="aqi-value">--</span>
            </p>
            <p class="metric__sub">
              <span class="pill" id="aqi-label">—</span>
              PM2.5 <span id="pm25-value">--</span>
            </p>
          </div>
        </section>

        <section class="period" aria-label="白天與夜間穿搭建議">
          <div class="period__tabs" role="tablist">
            <button
              class="period__tab is-active"
              role="tab"
              aria-selected="true"
              data-period="day"
              id="tab-day"
            >
              今天白天
            </button>
            <button
              class="period__tab"
              role="tab"
              aria-selected="false"
              data-period="night"
              id="tab-night"
            >
              今天晚上
            </button>
          </div>

          <div class="period__panel" id="period-panel">
            <div class="period__weather">
              <div class="period__icon" id="period-icon" aria-hidden="true"></div>
              <div class="period__meta">
                <p class="period__range">
                  <span id="period-low">--</span>° ~
                  <span id="period-high">--</span>°
                </p>
                <p class="period__desc" id="period-desc">—</p>
              </div>
              <div class="rain-badge" title="降雨機率">
                <span id="period-rain">--</span>%
              </div>
            </div>

            <div class="advice" id="advice-row" aria-label="穿搭與生活建議"></div>
          </div>
        </section>

        <section class="hourly" aria-label="三小時預報">
          <div class="section-head">
            <h2>三小時預報</h2>
            <p>氣溫走勢與降雨機率</p>
          </div>
          <div class="hourly__scroll" id="hourly-list"></div>
        </section>
      </main>

      <footer class="foot">
        <p>資料來源 Open-Meteo · 圖示 Twemoji · 台灣日夜溫差穿搭助手</p>
      </footer>
    </div>

    <div
      class="place-sheet"
      id="place-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="place-sheet-title"
      hidden
    >
      <button
        type="button"
        class="place-sheet__backdrop"
        id="place-backdrop"
        aria-label="關閉地區選擇"
      ></button>
      <div class="place-sheet__panel">
        <div class="place-sheet__head">
          <h2 id="place-sheet-title">選擇地區</h2>
          <button type="button" class="place-sheet__close" id="place-close">
            關閉
          </button>
        </div>
        <button type="button" class="place-geo" id="place-geo">
          <span class="place-geo__icon" id="place-geo-icon" aria-hidden="true"></span>
          <span class="place-geo__text">
            <strong>使用目前位置</strong>
            <small>需要瀏覽器定位權限</small>
          </span>
        </button>
        <label class="place-search">
          <span class="visually-hidden">搜尋縣市或行政區</span>
          <input
            type="search"
            id="place-search"
            placeholder="搜尋縣市、行政區…"
            autocomplete="off"
            enterkeyhint="search"
          />
        </label>
        <ul class="place-list" id="place-list" role="listbox" aria-label="地區清單"></ul>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
