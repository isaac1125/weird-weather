<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7eb8d4" />
    <meta
      name="description"
      content="Weird Weather — 為台灣日夜溫差設計的穿搭天氣建議"
    />
    <title>Weird Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sky__glow sky__glow--a"></div>
      <div class="sky__glow sky__glow--b"></div>
      <div class="sky__haze"></div>
    </div>

    <div id="app" class="app">
      <header class="topbar">
        <p class="brand">Weird Weather</p>
        <button
          type="button"
          class="location"
          id="location-btn"
          aria-haspopup="dialog"
          aria-controls="place-sheet"
          aria-expanded="false"
        >
          <span class="location__pin" id="location-pin" aria-hidden="true"></span>
          <span id="place-name">選擇地區…</span>
          <span class="location__chevron" aria-hidden="true">▾</span>
        </button>
        <p class="status-chip" id="data-status">讀取天氣</p>
      </header>

      <main class="main">
        <section class="outfit-hero" aria-label="今日穿搭建議">
          <p class="outfit-hero__period" id="period-label">現在 · 白天</p>
          <div class="outfit-hero__stack" id="outfit-stack" aria-live="polite"></div>
          <h1 class="outfit-hero__title" id="outfit-title">—</h1>
          <p class="outfit-hero__reason" id="outfit-reason">讀取穿搭建議…</p>
          <p class="outfit-hero__peek" id="period-peek"></p>
        </section>

        <section class="support" aria-label="輔助天氣資訊">
          <div class="support__weather">
            <div class="support__cell">
              <span class="support__label">現在</span>
              <span class="support__value"
                ><span id="current-temp">--</span>°</span
              >
            </div>
            <div class="support__cell">
              <span class="support__label">體感</span>
              <span class="support__value"
                ><span id="feels-like">--</span>°</span
              >
            </div>
            <div class="support__cell">
              <span class="support__label">降雨</span>
              <span class="support__value"
                ><span id="period-rain">--</span>%</span
              >
            </div>
            <div class="support__cell support__cell--range">
              <span class="support__label" id="period-range-label">時段</span>
              <span class="support__value support__value--sm">
                <span id="period-low">--</span>° ~
                <span id="period-high">--</span>°
              </span>
            </div>
          </div>
          <div class="cues" id="cue-row" aria-label="穿搭相關提醒"></div>
        </section>

        <details class="hourly" id="hourly-details">
          <summary>
            <span>三小時走勢</span>
            <span class="hourly__hint">氣溫 · 降雨</span>
          </summary>
          <div class="hourly__scroll" id="hourly-list"></div>
        </details>
      </main>

      <footer class="foot">
        <p>資料來源 Open-Meteo · 圖示 Twemoji · 台灣日夜溫差穿搭助手</p>
      </footer>
    </div>

    <div
      class="place-sheet"
      id="place-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="place-sheet-title"
      hidden
    >
      <button
        type="button"
        class="place-sheet__backdrop"
        id="place-backdrop"
        aria-label="關閉地區選擇"
      ></button>
      <div class="place-sheet__panel">
        <div class="place-sheet__head">
          <h2 id="place-sheet-title">選擇地區</h2>
          <button type="button" class="place-sheet__close" id="place-close">
            關閉
          </button>
        </div>
        <button type="button" class="place-geo" id="place-geo">
          <span class="place-geo__icon" id="place-geo-icon" aria-hidden="true"></span>
          <span class="place-geo__text">
            <strong>使用目前位置</strong>
            <small>需要瀏覽器定位權限</small>
          </span>
        </button>
        <label class="place-search">
          <span class="visually-hidden">搜尋縣市或行政區</span>
          <input
            type="search"
            id="place-search"
            placeholder="搜尋縣市、行政區…"
            autocomplete="off"
            enterkeyhint="search"
          />
        </label>
        <ul class="place-list" id="place-list" role="listbox" aria-label="地區清單"></ul>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
